:root{--ff:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Roboto,Inter,system-ui,sans-serif;--ink:#090c14;--hair:#ffffff17;--muted:#9aa4bd;--champ:#e8c987}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:#f3f5fb;font-family:var(--ff);-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#lobby{position:absolute;inset:0;display:flex;flex-direction:column;gap:clamp(8px,1.6dvh,16px);padding:calc(12px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));max-width:720px;margin:auto;background:radial-gradient(60% 38% at 12% 0,#e8c98726,transparent 70%),radial-gradient(55% 40% at 100% 100%,#4fe0d21f,transparent 70%)}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.mark{width:34px;height:34px;border-radius:11px;background:conic-gradient(from 210deg,#5fd3ff,#b784ff,#ff7fb0,#ffc24d,#5be3a3,#5fd3ff);display:grid;place-items:center;box-shadow:0 6px 18px #0008,inset 0 0 0 1px #fff4}
.mark::after{content:"";width:12px;height:12px;border-radius:4px;background:#090c14;transform:rotate(45deg)}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--hair);border-radius:99px;padding:6px 11px;background:#ffffff08;display:flex;align-items:center;gap:7px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:#5be3a3;box-shadow:0 0 8px #5be3a3}
.hero h1{margin:6px 0 4px;font-size:clamp(30px,8.4vw,44px);line-height:1.02;font-weight:800;letter-spacing:-.035em;background:linear-gradient(180deg,#fff,#c9d2ea);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);font-size:14px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:10px}
.card{position:relative;overflow:hidden;min-height:0;text-align:left;color:inherit;font:inherit;padding:14px;border-radius:22px;border:1px solid var(--hair);cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;background:radial-gradient(120% 90% at 100% 0,color-mix(in srgb,var(--a) 34%,transparent),transparent 60%),linear-gradient(165deg,#161c30,#0d1120);box-shadow:inset 0 1px #ffffff1f,0 14px 28px -14px #000c;transition:transform .16s,border-color .16s}
.card:active{transform:scale(.97)}
.card:hover{border-color:color-mix(in srgb,var(--a) 55%,transparent)}
.idx{position:absolute;top:13px;left:15px;font-size:11px;font-weight:700;color:#ffffff66;font-variant-numeric:tabular-nums}
.glyph{position:absolute;top:10px;right:12px;width:clamp(38px,6.6dvh,52px);aspect-ratio:1;border-radius:16px;display:grid;place-items:center;font-size:clamp(20px,3.4dvh,27px);color:var(--a);background:color-mix(in srgb,var(--a) 16%,#0b0f1c);border:1px solid color-mix(in srgb,var(--a) 40%,transparent);box-shadow:0 0 26px -4px color-mix(in srgb,var(--a) 60%,transparent)}
.meta b{display:block;font-size:clamp(14px,1.9dvh,16px);font-weight:700;letter-spacing:-.01em;line-height:1.15}
.meta small{display:block;margin-top:3px;font-size:12px;color:var(--muted);line-height:1.25}
.go{position:absolute;right:12px;bottom:12px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 22%,transparent)}
.go svg{width:14px;height:14px;fill:none;stroke:var(--a);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.meta{padding-right:30px}
#player-view{display:none;position:fixed;inset:0;background:var(--ink);flex-direction:column}
body.playing #lobby{display:none}body.playing #player-view{display:flex}
.gamebar{flex:none;height:calc(46px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:10px;background:#0d1220f2;border-bottom:1px solid var(--hair)}
#back{height:34px;padding:0 13px 0 9px;border-radius:99px;border:1px solid var(--hair);background:#ffffff0d;color:#fff;font:600 13px var(--ff);display:flex;align-items:center;gap:4px;cursor:pointer}
#back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#current-title{font-size:14px;font-weight:700;letter-spacing:-.01em;color:#e9edf8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gameframe{flex:1;min-height:0;width:100%;border:0;background:var(--ink)}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}}
@media(max-height:640px){.hero p{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes drift{0%{transform:translate3d(-4%,-3%,0) scale(1)}100%{transform:translate3d(4%,4%,0) scale(1.12)}}
@keyframes spin{to{--ang:360deg}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes foil{0%{background-position:0 50%}100%{background-position:200% 50%}}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.8}}
#lobby::before{content:"";position:absolute;inset:-12%;pointer-events:none;background:radial-gradient(36% 28% at 20% 12%,#6d5cff55,transparent 70%),radial-gradient(34% 30% at 92% 70%,#17c8ff3a,transparent 70%),radial-gradient(30% 26% at 8% 92%,#ff5fc233,transparent 70%);animation:drift 14s ease-in-out infinite alternate}
#lobby::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 14% 30%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 82% 18%,#fff 0 1.2px,transparent 1.8px),radial-gradient(circle at 60% 52%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 92% 86%,#fff 0 1px,transparent 1.6px),radial-gradient(circle at 8% 78%,#fff 0 1.2px,transparent 1.8px);animation:tw 4s ease-in-out infinite}
#lobby>*{position:relative;z-index:1}
.hero h1{background:linear-gradient(100deg,#fff 0,#bcd0ff 30%,#fff 50%,#f3dca0 70%,#fff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;animation:foil 7s linear infinite}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),transparent 0 62%,var(--a) 82%,#fff 90%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite;pointer-events:none}
.card:nth-child(2n)::before{animation-delay:-2s}.card:nth-child(3n)::before{animation-delay:-4s}
.card::after{content:"";position:absolute;top:0;bottom:0;left:0;width:30%;background:linear-gradient(100deg,transparent,#ffffff1f,transparent);animation:sheen 6s ease-in-out infinite;pointer-events:none}
.card:nth-child(2n)::after{animation-delay:-3s}
@keyframes sheen{0%{transform:translateX(-140%) skewX(-18deg)}50%,100%{transform:translateX(420%) skewX(-18deg)}}
.glyph{animation:flt 4s ease-in-out infinite}.card:nth-child(2n) .glyph{animation-delay:-2s}
.card:hover{box-shadow:inset 0 1px #ffffff1f,0 0 34px -6px var(--a),0 14px 28px -14px #000c}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}</style>
